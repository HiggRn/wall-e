[package]
name = "wall-e-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
cobs = "0.5"
common = { package = "wall-e-common", path = "../common" }
crossterm = "0.29"
hex = "0.4"
postcard = "1.0"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serialport = "4.2"
thiserror = { version = "2.0", default-features = false }
heapless = { version = "0.9.2", features = ["serde"] }
bip39 = "2.2.2"
