[package]
name = "wall-e-common"
version = "0.1.0"
edition = "2024"

[dependencies]
postcard = { version = "1.0", default-features = false }
serde = { version = "1.0", default-features = false, features = [
    "derive",
    "alloc",
] }
cobs = { version = "0.5", default-features = false }

cipher = { version = "0.4", default-features = false, features = [
    "block-padding",
    "alloc",
] }
k256 = { version = "0.13", default-features = false, features = [
    "ecdsa",
    "arithmetic",
] }
bip32 = { version = "0.5.3", default-features = false }
bip39 = { version = "2.2.2", default-features = false }
digest = { version = "0.10", default-features = false }
heapless = { version = "0.9.2", features = ["serde"] }
thiserror = { version = "2.0", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
qrcode = { git = "https://github.com/kennytm/qrcode-rust.git", default-features = false }
